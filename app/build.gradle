plugins {
    id 'com.android.application'
}

def cpmSourceCacheDir = System.getenv("HOME") + "/.cache/CPM/vmpc"
def juceSourceDir = cpmSourceCacheDir + "/juce/aap-vmpc-7.0.9-vmpc"

android {
    namespace = "org.androidaudioplugin.ports.juce.vmpc"
    compileSdk = libs.versions.android.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.android.minSdk.get().toInteger()
        targetSdk = libs.versions.android.targetSdk.get().toInteger()
        ndk {
            abiFilters "x86_64", "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID=1",
                        "-DAAP_DIR=${System.env.AAP_DIR != null ? System.env.AAP_DIR : "$projectDir/../external/aap-core"}",
                        "-DAAP_JUCE_DIR=${System.env.AAP_JUCE_DIR != null ? System.env.AAP_JUCE_DIR : "$projectDir/../external/aap-juce"}",
                        "-DCPM_SOURCE_CACHE=${cpmSourceCacheDir}",
                        "-DANDROID_STL=c++_shared", "-DANDROID_CPP_FEATURES=exceptions rtti"
            }
        }
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }

    sourceSets {
        // We tweak some Java classes compiled into the app apk so that they can be loaded before falling back to the original implementation in JUCE.
        main.java.srcDirs +=
                ["${juceSourceDir}/modules/juce_gui_basics/native/java/app",
                 "${juceSourceDir}/modules/juce_gui_basics/native/javaopt/app",
                 "../external/vmpc-juce/editables/juce-raw-keyboard-input-module/android/java",
                 "../external/aap-juce/java"]
        main.res.srcDirs +=
                []
    }

    dependencies {
        implementation libs.androidx.core.ktx
        implementation libs.startup.runtime
        implementation libs.aap.core
        implementation libs.aap.midi.device.service
        implementation libs.aap.ui.web
        implementation libs.aap.ui.compose
        implementation libs.aap.ui.compose.app
        implementation libs.aap.js.controller
        // switch to them when you want to debug into aap-core.
        /*
        implementation project(":androidaudioplugin")
        implementation project(":androidaudioplugin-midi-device-service")
        implementation project(":androidaudioplugin-ui-web")
        implementation project(":androidaudioplugin-ui-compose")
        implementation project(":androidaudioplugin-ui-compose-app")
         */
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version libs.versions.cmake.get()
        }
    }

    buildFeatures {
        prefab true
    }

    ndkVersion libs.versions.ndk.get()

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
